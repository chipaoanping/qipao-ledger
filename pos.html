<!doctype html>
<html lang="zh-Hant" data-theme="light" style="color-scheme:light only">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旗跑收銀</title>
<meta name="theme-color" content="#732d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旗跑收銀">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="pos.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 收銀台：左邊點品項，右邊是這一筆的明細與收款；「今日交易」在上方切換 */
:root{--bg:#f2ece6;--paper:#fffdf9;--ink:#33241e;--ink-2:#6b574c;--ink-3:#9c8a7e;--rule:#e7dcd2;--soft:#f6f0ea;--hover:#faf5ef;
  --jade:#567252;--jade-soft:#e8eee4;--accent:#893714;--wine:#732d2e;--mustard:#e1b65a;--rose:#d9a38c;--gold-soft:#f8ecd2;--neg:#b3261e;
  --tile:#7a3f25;--tile-bg:#f5e9d6;--tile-ink:#1f4a3c;
  --shadow:0 1px 0 rgba(115,45,46,.04),0 8px 20px -12px rgba(115,45,46,.25);
  --f-display:"Noto Serif TC","Songti TC",serif;--f-body:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh;-webkit-tap-highlight-color:transparent;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hint{color:var(--ink-3);font-size:13px}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:10px 16px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fffaf2}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--neg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-size:15px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:calc(100vw - 32px)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.seal{width:40px;height:40px;border-radius:50%;background:var(--wine);color:#f1d08a;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:19px;transform:rotate(-4deg)}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.08em}
.brand small{display:block;color:var(--ink-3);font-size:12px;letter-spacing:.1em}
.tabs{display:flex;background:var(--soft);border:1px solid var(--rule);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:999px;color:var(--ink-2);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.who i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--wine);display:grid;place-items:center;font-weight:700}
.net{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px}
.net::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--jade)}
.net.off::before{background:var(--mustard)}

/* register */
.reg{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow)}
.menu{padding:16px 18px 20px}
.cat{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:19px;font-weight:700;margin:4px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.cat::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.item{position:relative;border:1px solid var(--rule);background:var(--paper);border-radius:14px;padding:14px 12px 12px;display:grid;justify-items:center;gap:8px;text-align:center;transition:transform .12s,box-shadow .12s,border-color .12s;min-height:150px}
.item:hover{border-color:var(--mustard)}
.item:active{transform:scale(.97)}
.item{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.item.lifted{z-index:5;box-shadow:0 14px 34px rgba(0,0,0,.22);border-color:var(--mustard);transition:none;cursor:grabbing}
body.dragging{-webkit-user-select:none;user-select:none}
#dragTrash{position:fixed;left:50%;bottom:24px;transform:translate(-50%,200%);z-index:20;display:flex;align-items:center;gap:10px;padding:16px 30px;border-radius:999px;background:#fff;border:2px dashed #b0402f;color:#b0402f;font-size:19px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .18s,background .12s,color .12s;pointer-events:none}
#dragTrash svg{width:26px;height:26px}
body.dragging #dragTrash{transform:translate(-50%,0);pointer-events:auto}
#dragTrash.hot{background:#b0402f;color:#fff;border-style:solid;transform:translate(-50%,0) scale(1.08)}
body.dragging .chip[data-cat]:not([data-cat=""]){border-style:dashed}
.chip.drop{background:var(--mustard)!important;border-color:var(--mustard)!important;border-style:solid!important;color:var(--ink)!important;transform:scale(1.04)}
.drag-hint{margin:0 0 10px;font-size:13px}
.item .tile{width:72px;height:72px;border-radius:10px;border:5px solid var(--tile);background:var(--tile-bg);color:var(--tile-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:34px}
.item .nm{font-weight:600;font-size:19px}
.item .pr{font-size:22px;font-weight:700;color:var(--wine)}
#pickBox{position:fixed;inset:0;z-index:30;background:rgba(40,28,22,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.pick-card{background:var(--paper);border-radius:16px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.pick-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;position:sticky;top:-18px;background:var(--paper);padding:6px 0}
.pick-h b{display:block;font-family:var(--f-display);font-size:22px}
.item.pick .stk{color:var(--ink-2)}
.subcat{font-size:16px;font-weight:700;color:#6b5a50;margin:14px 0 8px}
.item .tile.photo{background-size:cover;background-position:center;border:1px solid var(--rule)}
.item .stk{font-size:14px;color:#8a7a70;margin-top:-4px}
.item.out .stk{color:#b0402f}
.item .tile.t-green{--tile:#1f4a25;--tile-bg:#f5e9d6;--tile-ink:#8a3b1f}
.item .tile.t-copper{--tile:#b06a45;--tile-bg:#f5e9d6;--tile-ink:#5a2614}
.item .tile.t-red{--tile:#a8392f;--tile-bg:#a8392f;--tile-ink:#fbeedd;outline:1px dashed rgba(251,238,221,.7);outline-offset:-5px;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 3px,transparent 3px 7px),repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 3px,transparent 3px 7px)}
.item .tile.t-white{--tile:#fff;--tile-bg:#fff;--tile-ink:#8a3b1f;box-shadow:0 0 0 1px var(--rule)}
.item .tile.t-klook{--tile:#ef6b2f;--tile-bg:#ef6b2f;--tile-ink:#fff;background-image:radial-gradient(circle at 80% 0,#5ccad3 0 28%,transparent 29%),radial-gradient(circle at 20% 115%,#f7c74a 0 38%,transparent 39%)}
.item .tile.t-creamred{--tile:#f3e7da;--tile-bg:#f3e7da;--tile-ink:#8a3426}
.item .tile.t-creamgreen{--tile:#f3e7da;--tile-bg:#f3e7da;--tile-ink:#1f4a25}
.item .tile.t-idred{--tile:#8a2f24;--tile-bg:#f5e9d6;--tile-ink:#8a2f24}
.item .tile.t-idteal{--tile:#3f8a7e;--tile-bg:#f5e9d6;--tile-ink:#8a2f24}
.item .tile.t-idpink{--tile:#c9736a;--tile-bg:#c9736a;--tile-ink:#fff}
.item .tile.t-salon{--tile:#5a3a33;--tile-bg:#f5e9d6;--tile-ink:#5a3a33}
.item .tile.t-darkgreen{--tile:#2f4a45;--tile-bg:#2f4a45;--tile-ink:#fff}
.item .tile.t-olive{--tile:#7e7d5c;--tile-bg:#7e7d5c;--tile-ink:#fff}
.item .tile.t-bday{--tile:#fff;--tile-bg:#fff;--tile-ink:#b0602a;box-shadow:0 0 0 1px var(--rule);background-image:radial-gradient(circle at 88% 88%,#f6d23a 0 16%,transparent 17%)}
.item .tile.t-pet{--tile:#ead8bf;--tile-bg:#ead8bf;--tile-ink:#1a1410;border-top:3px solid #8a6a4a}
.item .tile.t-creambrown{--tile:#f3e7da;--tile-bg:#f3e7da;--tile-ink:#3a2016}
.item .tile.t-kkday{--tile:#5bbcc9;--tile-bg:#5bbcc9;--tile-ink:#fff}
.item .tile.t-klook,.item .tile.t-kkday{font-family:inherit;font-weight:800;font-size:17px!important;word-break:normal;white-space:nowrap;letter-spacing:-.5px}
.item .tile.t-klook.l2,.item .tile.t-kkday.l2{font-size:26px!important}
.item .tile.l2{font-size:25px}.item .tile.l3{font-size:21px;line-height:1.1;padding:0 4px;word-break:break-all}
.item .ct{position:absolute;top:8px;right:8px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--wine);color:#fffaf2;font-size:14px;font-weight:700;display:grid;place-items:center}

.cart{position:sticky;top:12px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-height:calc(100vh - 90px)}
.cart-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.cart-h h2{margin:0;font-family:var(--f-display);font-size:18px}
.cart-body{overflow:auto;padding:4px 16px}
.empty{color:var(--ink-3);text-align:center;padding:30px 0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
.line .n{font-weight:500}
.line .u{font-size:13px;color:var(--ink-3)}
.step{display:flex;align-items:center;border:1px solid var(--rule);border-radius:999px}
.step button{border:0;background:transparent;width:34px;height:34px;font-size:18px;color:var(--ink-2)}
.step span{min-width:22px;text-align:center;font-weight:700}
.line .amt{min-width:64px;text-align:right;font-weight:500}
.sec{padding:12px 0;border-bottom:1px solid var(--soft);display:grid;gap:8px}
.sec .lab{font-size:13px;color:var(--ink-2);font-weight:500}
.cnts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cnt{display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--ink-2)}
.pays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pays button{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 4px;font-size:14px;font-weight:500}
.pays button[aria-pressed="true"]{border-color:var(--wine);background:var(--wine);color:#fffaf2}
.row2{display:flex;gap:8px;align-items:center}
.tin{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--rule);background:var(--soft);border-radius:999px;padding:4px 12px;font-size:14px}
.chg{display:flex;justify-content:space-between;font-size:15px}
.chg b{font-size:18px}
.cart-f{border-top:1px solid var(--rule);padding:12px 16px 16px;display:grid;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot span{color:var(--ink-2)}
.tot b{font-family:var(--f-display);font-size:30px;color:var(--wine)}
.go{font-size:18px;padding:14px;border-radius:14px}

/* today */
.today{display:grid;gap:16px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:16px}
.sum div{display:grid;gap:2px}
.sum span{font-size:13px;color:var(--ink-2)}
.sum b{font-size:20px}
.sum .big b{font-family:var(--f-display);font-size:26px;color:var(--wine)}
.orders{padding:4px 16px 8px}
.ord{display:grid;grid-template-columns:70px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--soft)}
.ord:last-child{border-bottom:0}
.ord .no{font-weight:700}
.ord .t{font-size:13px;color:var(--ink-3)}
.ord .it{min-width:0}
.ord .am{font-weight:700;text-align:right}
.ord .act{display:flex;gap:6px}
.ord .act .btn{padding:6px 10px;font-size:14px}
.ord.void{opacity:.5}
.ord.void .am{text-decoration:line-through}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--ink-2);margin-left:6px}

/* settings */
.set{padding:18px;display:grid;gap:16px;max-width:640px}
.set label{display:grid;gap:6px}
.set .fl{font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.catbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.menu-side{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:start}
.menu-side .catbar{flex-direction:column;flex-wrap:nowrap;margin:0;position:sticky;top:12px}
.menu-side .chip{text-align:left;border-radius:10px;padding:13px 16px;font-size:19px}
.menu-body>.cat:first-child{margin-top:0}
@media (max-width:640px){ .menu-side{display:block} .menu-side .catbar{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;margin:0 0 16px;position:static;scrollbar-width:none} .menu-side .chip{border-radius:999px;padding:8px 16px} }
.catbar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:9px 18px;font:inherit;font-size:17px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.me-cat{display:grid;gap:8px;padding:12px;border:1px solid var(--rule);border-radius:12px;background:var(--soft)}
.me-ch{display:flex;gap:4px;align-items:center}.me-ch .tin{font-weight:700;flex:1}
.me-row{display:grid;grid-template-columns:76px 82px minmax(0,1fr) 130px 120px auto;gap:6px;align-items:center}
.me-mk{text-align:center;font-family:var(--f-display);font-weight:900;padding-left:4px;padding-right:4px;font-size:15px}
.me-pr{display:flex;align-items:center;gap:4px;color:var(--ink-2)}
.me-act{display:flex}.me .btn.ghost{padding:6px 9px}
@media (max-width:560px){ .me-row{grid-template-columns:64px minmax(0,1fr) 110px;grid-template-areas:'mk tn tn' 'nm nm nm' 'sel sel pr' 'act act act';padding-bottom:6px;border-bottom:1px dashed var(--rule)} .me-mk{grid-area:mk} .me-tn{grid-area:tn} .me-row>.tin[data-k=name]{grid-area:nm} .me-sel{grid-area:sel} .me-pr{grid-area:pr} .me-act{grid-area:act;justify-content:flex-end} }
.seg button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 14px}
.seg button[aria-pressed="true"]{border-color:var(--wine);background:var(--wine);color:#fffaf2}

/* login */
.login{display:grid;justify-items:center;padding:20px 0 40px}
.lg-card{width:100%;max-width:520px;background:var(--paper);border:1px solid var(--rule);border-radius:20px;box-shadow:var(--shadow);padding:30px 24px 24px;text-align:center;display:grid;gap:10px}
.lg-card h2{font-family:var(--f-display);margin:0;font-size:22px;letter-spacing:.08em}
.lg-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.lg-name{border:1px solid var(--rule);background:var(--paper);border-radius:14px;padding:14px 8px 10px;display:grid;justify-items:center;gap:6px}
.lg-name i{font-style:normal;width:42px;height:42px;border-radius:50%;background:var(--gold-soft);color:var(--wine);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:18px}
.lg-pw{display:grid;gap:8px;justify-self:center;width:100%;max-width:320px}
.lg-err{color:var(--neg);margin:0;min-height:1.4em;font-size:14px}
.lg-back{border:0;background:transparent;color:var(--ink-3);font-size:14px}

/* 收據預覽（瀏覽器列印用） */
#printArea{display:none}
@media print{
  @page{margin:0}
  body{background:#fff;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
}

@media (max-width:1000px){ .reg{grid-template-columns:minmax(0,1fr) 340px} .items{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))} }
@media (max-width:700px){
  .reg{grid-template-columns:minmax(0,1fr)}
  .cart{position:static;max-height:none}
  .items{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .ord{grid-template-columns:56px minmax(0,1fr) auto}
  .ord .act{grid-column:1/-1;justify-content:flex-end}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="seal">旗</div><div><b id="brName">旗跑收銀</b><small id="brSub">旗跑・安平</small></div></div>
  <nav class="tabs" id="brTabs" hidden><button data-br="qp" aria-pressed="true">旗跑</button><button data-br="yl" aria-pressed="false">旗時</button></nav>
  <nav class="tabs" id="tabs" hidden>
    <button data-tab="reg" aria-pressed="true">收銀</button>
    <button data-tab="today" aria-pressed="false">今日交易</button>
    <button data-tab="set" aria-pressed="false">設定</button>
  </nav>
  <span class="net" id="net">連線中</span>
  <div class="who" id="who" hidden></div>
</header>
<main id="main"></main>
<div id="printArea"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const sum=a=>a.reduce((x,y)=>x+y,0);
const pad=m=>String(m).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const hm=iso=>{const d=new Date(iso);return `${pad(d.getHours())}:${pad(d.getMinutes())}`;};
function toast(msg,ms){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2400);}

/* ---------- 分店與品項 ---------- */
const B={ qp:{name:'旗跑・安平', short:'旗跑', prefix:'QP'}, yl:{name:'旗時・永樂', short:'旗時', prefix:'YL'} };
/* 品項存在 misc/posmenu（每間店一份）；還沒存過時用這份預設 */
const MENU_DEF={
  qp:[ {cat:'日租旗袍', items:[
    {id:'rent-cu', name:'銅款旗袍', mark:'銅', price:1300},
    {id:'rent-ag', name:'銀款旗袍', mark:'銀', price:1500},
    {id:'rent-au', name:'金款旗袍', mark:'金', price:1700},

async function ylRecordSale(o,lines){
  const sk=lines.filter(l=>l.id.startsWith('sk-')); if(!sk.length) return;
  if(!ylReady()){ toast('這筆有永樂庫存的寄售商品，但這台 iPad 還沒登入永樂庫存，沒有扣庫存，請到永樂庫存登記售出',6000); FB.fs.doc('posorders/'+o.id).update({ylErr:'未登入永樂庫存'}).catch(()=>{}); return; }
  const pay=o.pay==='linepay'?'linepay':'cash', ids=[], miss=[];
  try{
    const b=YLA.fs.batch();
    for(const l of sk){
      const it=ylFind(l); if(!it){ miss.push(l.name); continue; }
      const ref=YLA.fs.collection('items').doc(it.id), fresh=(await ylFresh(ref))||it, n=l.qty;
      let upd, after;
      if(l.ylVar&&Array.isArray(fresh.variants)&&fresh.variants.length){ const vs=fresh.variants.map(v=>({...v})); const x=vs.find(v=>v.name===l.ylVar); if(!x||Number(x.qty||0)<n){ miss.push(l.name); continue; } x.qty=Number(x.qty||0)-n; after=x.qty; upd={variants:vs,qty:vs.reduce((a,v)=>a+Number(v.qty||0),0),updatedAt:Date.now()}; }
      else { const cur=Number(fresh.qty||0); if(cur<n){ miss.push(l.name); continue; } after=cur-n; upd={qty:after,updatedAt:Date.now()}; }
      const rate=Number(fresh.rate??it.rate??30), amount=l.amt, commission=Math.round(amount*rate/100);
      b.update(ref,upd);
      const mv=YLA.fs.collection('moves').doc(); ids.push(mv.id);
      b.set(mv,{itemId:it.id,itemName:l.ylVar?`${it.name}（${l.ylVar}）`:it.name,variant:l.ylVar||'',sku:fresh.sku||it.sku||'',brand:it.brand||ylBrand(l.cat),type:'sale',qty:n,price:l.price,amount,rate,commission,payout:amount-commission,pay,fee:0,charged:amount,photoId:'',after,note:`POS 收銀 ${o.date} 第 ${o.seq} 筆`,by:YLA.user.uid,at:Date.now(),posOrder:o.id});
    }
    if(ids.length){ await b.commit(); FB.fs.doc('posorders/'+o.id).update({ylMoves:ids}).catch(()=>{}); if(T.orders[o.id]) T.orders[o.id].ylMoves=ids; }

}

const itemTile=i=>`<button class="item${i.id.startsWith('sk-')&&i.stock<=0?' out':''}" data-add="${i.id}">${i.img?`<span class="tile photo" style="background-image:url('${i.img}')"></span>`:`<span class="tile l${Math.min([...(i.mark||'')].length,3)}${TONES[i.tone]?' t-'+i.tone:''}">${esc(i.mark)}</span>`}<span class="nm">${esc(i.name)}</span><span class="pr num">$${fmt(i.price)}</span>${i.id.startsWith('sk-')?`<span class="stk">${i.stock>0?'庫存 '+i.stock:'庫存 0'}</span>`:''}${qtyOf(i.id)?`<span class="ct">${qtyOf(i.id)}</span>`:''}</button>`;
const pickKey=(cat,sub)=>cat+'\u0001'+sub;
const pickItems=k=>{ const [cat,sub]=String(k||'').split('\u0001'); return Object.values(ITEMS).filter(i=>i.cat===cat&&i.sub===sub); };
const pickQty=k=>pickItems(k).reduce((a,i)=>a+qtyOf(i.id),0);
function subTile(c,n){ const its=c.items.filter(i=>i.sub===n), k=pickKey(c.cat,n), img=(its.find(i=>i.img)||{}).img, q=pickQty(k), mk=[...n.replace(/\s+/g,'')].slice(0,4).join(''), left=its.filter(i=>i.stock>0).length;
  return `<button class="item pick${left?'':' out'}" data-pick="${esc(k)}">${img?`<span class="tile photo" style="background-image:url('${esc(img)}')"></span>`:`<span class="tile l${Math.min([...mk].length,3)}">${esc(mk)}</span>`}<span class="nm">${esc(n)}</span><span class="stk">${its.length} 件商品 ›</span>${q?`<span class="ct">${q}</span>`:''}</button>`; }
/* 小分類的選商品視窗 */
let PICK=null;
function drawPick(){ let el=$('#pickBox'); if(!PICK){ if(el) el.remove(); return; }

  const h=`<div class="pick-card" role="dialog" aria-modal="true" aria-label="${esc(sub)}"><div class="pick-h"><div><span class="hint">${esc(cat)}</span><b>${esc(sub)}</b></div><button class="btn" data-pickclose="1">完成</button></div><div class="items">${its.map(itemTile).join('')}</div></div>`;
  if(!el){ document.body.insertAdjacentHTML('beforeend',`<div id="pickBox">${h}</div>`); } else el.innerHTML=h; }
const drawCart=()=>{ const el=$('#cart'); if(el) el.innerHTML=cartHTML(); document.querySelectorAll('.item').forEach(b=>{ const q=b.dataset.pick!=null?pickQty(b.dataset.pick):qtyOf(b.dataset.add); const c=b.querySelector('.ct'); if(q&&!c) b.insertAdjacentHTML('beforeend',`<span class="ct">${q}</span>`); else if(c){ if(q) c.textContent=q; else c.remove(); } }); };
function menuHTML(){
  const ms=shownMenu(); if(!ms.some(c=>c.items.length)) return `<p class="empty">${esc(B[BR].name)}還沒有品項${canEdit()?'，請到「設定 → 品項管理」新增':'，請找妃妃到「設定」新增'}</p>`;
  const names=[...ms.map(c=>c.cat),...(CATS_DEF[BR]||[]).filter(n=>!ms.some(c=>c.cat===n))];
  if(T.cat&&!names.includes(T.cat)) T.cat=null;
  const chips=names.length>1?`<nav class="catbar" aria-label="分類">${['',...names].map(n=>`<button class="chip" data-cat="${esc(n)}" aria-pressed="${(T.cat||'')===n}">${n?esc(n):'全部'}</button>`).join('')}</nav>`:'';
  const shown=T.cat?ms.filter(c=>c.cat===T.cat):ms.filter(c=>c.items.length);
  const hint=canEdit()?'<p class="hint drag-hint">長按品項可以拖曳調整順序，拖到左邊分類放開就會移過去，拖到下方垃圾桶可以刪除</p>':'';
  const wrap=h=>chips?`<div class="menu-side">${chips}<div class="menu-body">${hint}${h}</div></div>`:hint+h;
  if(!shown.some(c=>c.items.length)) return wrap(`<p class="empty">「${esc(T.cat)}」還沒有品項${canEdit()?'，到「設定 → 品項管理」新增':''}</p>`);
  const subsOf=c=>{ const o=VORD[c.cat]||[], rk=n=>{ const k=o.indexOf(n); return k<0?1e6:k; }; return [...new Set(c.items.map(i=>i.sub||'').filter(Boolean))].sort((a,b)=>rk(a)-rk(b)); };
  /* 連到永樂庫存的分類：永樂庫存裡的每個分類是一格，點了跳出視窗選商品 */
  const block=c=>{ const plain=c.items.filter(i=>!i.sub), subs=subsOf(c);
    if(VFLAT[c.cat]) return `<div class="cat">${esc(c.cat)}</div>${plain.length?`<div class="items" data-cat-items="${esc(c.cat)}">${plain.map(itemTile).join('')}</div>`:''}${subs.map(n=>`<div class="subcat">${esc(n)}</div><div class="items">${c.items.filter(i=>i.sub===n).map(itemTile).join('')}</div>`).join('')}`;  /* 直接列商品，照小分類分組 */
    return `<div class="cat">${esc(c.cat)}</div><div class="items" data-cat-items="${esc(c.cat)}">${plain.map(itemTile).join('')}${subs.map(n=>subTile(c,n)).join('')}</div>`; };
  return wrap(shown.filter(c=>c.items.length).map(block).join(''));
}

/* ---------- 品項管理（妃妃和郁雯） ---------- */
const MENU_EDITORS=['郁雯'];
const canEdit=()=>W.admin||MENU_EDITORS.includes(W.name);
const ME={b:null,draft:null,dirty:false,busy:false};
const meDraft=()=>{ if(!ME.draft||ME.b!==BR){ ME.b=BR; const d=JSON.parse(JSON.stringify(menuOf())); (CATS_DEF[BR]||[]).forEach(n=>{ if(!d.some(c=>c.cat===n)) d.push({cat:n,items:[]}); }); ME.draft=d; ME.dirty=false; } return ME.draft; };
const newId=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function menuEditHTML(){
  const cats=meDraft(), up='↑', dn='↓';
  return `<section class="panel set me" style="max-width:820px;margin-bottom:16px">
    <div class="row2" style="justify-content:space-between;flex-wrap:wrap"><div><b>品項管理・${esc(B[BR].name)}</b><p class="hint" style="margin:4px 0 0">改好按「儲存品項」，所有收銀裝置會一起更新。切換上方「旗跑／旗時」可以編輯另一間店。</p></div>
      <div class="row2"><button class="btn" data-me="reset" ${ME.dirty?'':'disabled'}>還原</button><button class="btn primary" data-me="save" ${ME.dirty&&!ME.busy?'':'disabled'}>${ME.busy?'儲存中…':'儲存品項'}</button></div></div>
    ${cats.map((c,ci)=>`<div class="me-cat">
      <div class="me-ch"><input class="tin" data-mec="${ci}" value="${esc(c.cat)}" placeholder="分類名稱" maxlength="20" aria-label="分類名稱">
        <button class="btn ghost" data-me="cup" data-ci="${ci}" ${ci?'':'disabled'} aria-label="分類往上">${up}</button><button class="btn ghost" data-me="cdn" data-ci="${ci}" ${ci<cats.length-1?'':'disabled'} aria-label="分類往下">${dn}</button><button class="btn ghost danger" data-me="cdel" data-ci="${ci}">刪除分類</button></div>
      ${c.items.map((it,ii)=>`<div class="me-row"><input class="tin me-mk" data-mei="${ci}.${ii}" data-k="mark" value="${esc(it.mark)}" maxlength="4" aria-label="圖示字" placeholder="自動"><select class="tin me-tn" data-mei="${ci}.${ii}" data-k="tone" aria-label="圖示顏色">${Object.entries(TONES).map(([k,v])=>`<option value="${k}"${(it.tone||'')===k?' selected':''}>${v}</option>`).join('')}</select><input class="tin" data-mei="${ci}.${ii}" data-k="name" value="${esc(it.name)}" maxlength="30" placeholder="品項名稱" aria-label="品項名稱"><select class="tin me-sel" data-memv="${ci}.${ii}" aria-label="分類">${cats.map((o,oi)=>`<option value="${oi}"${oi===ci?' selected':''}>${esc(o.cat||'（未命名）')}</option>`).join('')}</select><span class="me-pr">$<input class="tin num" data-mei="${ci}.${ii}" data-k="price" type="number" inputmode="numeric" min="0" step="1" value="${esc(it.price)}" aria-label="價格"></span>
        <span class="me-act"><button class="btn ghost" data-me="iup" data-ci="${ci}" data-ii="${ii}" ${ii?'':'disabled'} aria-label="往上">${up}</button><button class="btn ghost" data-me="idn" data-ci="${ci}" data-ii="${ii}" ${ii<c.items.length-1?'':'disabled'} aria-label="往下">${dn}</button><button class="btn ghost danger" data-me="idel" data-ci="${ci}" data-ii="${ii}" aria-label="刪除">✕</button></span></div>`).join('')}
      <button class="btn" data-me="iadd" data-ci="${ci}">＋ 新增品項</button></div>`).join('')}
    <button class="btn" data-me="cadd">＋ 新增分類</button>
  </section>`;
}
function meAction(d){
  const cats=meDraft(), ci=+d.ci, ii=+d.ii, swap=(a,i,j)=>{ [a[i],a[j]]=[a[j],a[i]]; };
  switch(d.me){
    case 'cadd': cats.push({cat:'',items:[{id:newId(),name:'',mark:'',price:0}]}); break;
    case 'cdel': if(cats[ci].items.some(i=>i.name)&&!confirm(`刪除「${cats[ci].cat||'這個分類'}」和裡面 ${cats[ci].items.length} 個品項？`)) return; cats.splice(ci,1); break;
    case 'cup': swap(cats,ci,ci-1); break;
    case 'cdn': swap(cats,ci,ci+1); break;
    case 'iadd': cats[ci].items.push({id:newId(),name:'',mark:'',price:0}); break;
    case 'idel': cats[ci].items.splice(ii,1); break;
    case 'iup': swap(cats[ci].items,ii,ii-1); break;
    case 'idn': swap(cats[ci].items,ii,ii+1); break;
    case 'reset': ME.draft=null; render(); return;
    case 'save': saveMenu(); return;
  }
  ME.dirty=true; render();
  if(d.me==='iadd'||d.me==='cadd'){ const ins=document.querySelectorAll(d.me==='cadd'?'[data-mec]':`[data-mei^="${ci}."][data-k="name"]`); const el=ins[ins.length-1]; el&&el.focus(); }
}
async function saveMenu(){
  const cats=meDraft().map(c=>({cat:(c.cat||'').trim()||'未分類',items:c.items.filter(i=>(i.name||'').trim()).map(i=>{ const name=i.name.trim(); return {id:i.id||newId(),name,mark:((i.mark||'').trim()||name.slice(0,1)).slice(0,4),price:Math.max(0,Math.round(+i.price||0)),...(TONES[i.tone]&&i.tone?{tone:i.tone}:{}),...(i.img?{img:i.img}:{})}; })})).filter(c=>c.items.length||(CATS_DEF[BR]||[]).includes(c.cat));
  const bad=cats.flatMap(c=>c.items).filter(i=>!i.price&&!i.id.startsWith('lu-')&&i.id!=='yg-bag-gift'&&!i.id.startsWith('ya-'));  /* 盧經堂月結品項、滿額贈品、旗時配件本來就是 $0 */
  if(bad.length&&!confirm(`${bad.map(i=>i.name).join('、')} 的價格是 0，確定要儲存嗎？`)) return;
  ME.busy=true; render();
  try{ await FB.fs.doc('misc/posmenu').set({[BR]:cats,updatedAt:new Date().toISOString(),by:W.name||''},{merge:true}); MENUS[BR]=cats; buildItems(); ME.draft=null; ME.busy=false; render(); toast('品項已儲存'); }
  catch(e){ ME.busy=false; render(); toast(e&&e.code==='permission-denied'?'沒有修改權限':'儲存失敗，請再試一次',3500); }
}

/* ---------- 收據 ---------- */
function receiptHTML(o,test){
  const w=CFG.paper==58?384:576, fs=CFG.paper==58?22:26;
  const row=(l,r,st)=>`<tr${st?` style="${st}"`:''}><td>${l}</td><td style="text-align:right;white-space:nowrap">${r}</td></tr>`;
  const items=o.items.map(i=>row(`${esc(i.name)}<br><span style="font-size:.85em">$${fmt(i.price)} × ${i.qty}</span>`,`$${fmt(i.amt)}`)).join('');
  const cashRow=o.pay==='cash'&&o.paid?row('收現金',`$${fmt(o.paid)}`)+row('找零',`$${fmt(o.paid-o.total)}`):'';
  return `<div style="width:${w}px;font-family:'PingFang TC','Noto Sans TC',sans-serif;font-size:${fs}px;line-height:1.35;color:#000;background:#fff;padding:8px 4px">
    <div style="text-align:center;font-size:1.5em;font-weight:700">${esc(B[o.branch].name)}</div>
    ${CFG.head?`<div style="text-align:center;font-size:.8em;white-space:pre-line">${esc(CFG.head)}</div>`:''}
    <div style="text-align:center;margin:6px 0 2px">${test?'*** 測試收據 ***':'收　據'}</div>
    <div style="font-size:.85em">單號 ${esc(recNo(o))}<br>${esc(o.date)} ${hm(o.at)}　結帳 ${esc(o.staff)}</div>
    <hr style="border:0;border-top:2px dashed #000;margin:8px 0">
    <table style="width:100%;border-collapse:collapse;font-size:1em">${items}</table>
    <hr style="border:0;border-top:2px dashed #000;margin:8px 0">
    <table style="width:100%;border-collapse:collapse">${row('<b>合計</b>',`<b>$${fmt(o.total)}</b>`,'font-size:1.25em')}${o.pays&&Object.keys(o.pays).length>1?PAY.filter(([k])=>o.pays[k]).map(([k,n])=>row(n,`$${fmt(o.pays[k])}`)).join(''):row('付款方式',esc(payLabel(o)))}${cashRow}</table>
    ${CFG.foot?`<div style="text-align:center;margin-top:12px">${esc(CFG.foot)}</div>`:''}
    <div style="text-align:center;font-size:.75em;margin-top:6px">此為收據，非統一發票</div></div>`;
}
function printReceipt(o,test){
  if(CFG.printer==='off'){ if(test) toast('列印方式設為「不印收據」'); return; }
  const html=receiptHTML(o,test);
  if(CFG.printer==='browser'){ $('#printArea').innerHTML=html; setTimeout(()=>window.print(),50); return; }
  /* Star PassPRNT：把收據 HTML 交給 App 列印，印完自動回到這個網頁 */
  const q=new URLSearchParams({back:location.href.split('#')[0],html:`<html><body style="margin:0">${html}</body></html>`,size:CFG.paper==58?'2':'3',cut:'partial',popup:'disable'});
  if(CFG.drawer&&paysOf(o).cash&&!test) q.set('drawer','on');
  location.href='starpassprnt://v1/print/nopreview?'+q.toString();
}

/* ---------- 結帳 ---------- */
async function checkout(){
  const ls=cartLines(); if(!ls.length||C.busy) return;
  const tot=cartTotal(), paid=!C.split&&C.pay==='cash'?(C.paid===''?tot:Math.round(+C.paid)):0;
  if(!payOK()){ toast(C.split?'分開付款的金額不對':'收的現金不夠'); return; }
  const pays=C.split?splitAmts():{[C.pay]:tot};
  const now=new Date(), date=todayStr(), seq=nextSeq();
  const id=`${BR}-${date}-${pad(seq).padStart(3,'0')}-${Math.random().toString(36).slice(2,6)}`;
  const o={id,branch:BR,date,month:date.slice(0,7),seq,at:now.toISOString(),
    items:ls.map(l=>({id:l.id,name:l.name,cat:l.cat,price:l.price,qty:l.qty,amt:l.amt})),
    total:tot,pay:C.split?'split':C.pay,pays,paid,people:peopleOf(),foreign:C.foreign,returning:C.returning,
    note:C.note.trim(),staff:W.name,by:W.uid,void:null};
  C.busy=true; drawCart();
  /* 沒有網路時 Firestore 會先存在這台 iPad，連線後自動上傳；不讓結帳卡住 */
  const w=FB.fs.doc('posorders/'+id).set(o);
  const r=await Promise.race([w.then(()=>'ok',e=>e),new Promise(res=>setTimeout(()=>res('later'),2500))]);
  if(r!=='ok'&&r!=='later'){ C.busy=false; drawCart(); toast(r&&r.code==='permission-denied'?'沒有寫入權限：Firebase 規則需要開放 posorders':'結帳失敗，請再試一次',4000); return; }
  T.orders[id]=o; C=newCart(); render();
  ylRecordSale(o,ls);
  toast(`第 ${seq} 筆 $${fmt(tot)} 結帳完成${r==='later'?'（離線，連線後會自動上傳）':''}`);
  if(CFG.auto) printReceipt(o);
}
async function voidOrder(id){
  const o=T.orders[id]; if(!o||o.void) return;
  if(!confirm(`確定作廢第 ${o.seq} 筆 $${fmt(o.total)}？`)) return;
  const v={by:W.name,at:new Date().toISOString()};
  try{ await FB.fs.doc('posorders/'+id).update({void:v}); o.void=v; render(); toast(`第 ${o.seq} 筆已作廢`); ylVoidSale(o); }
  catch(e){ toast('作廢失敗'); }
}

const DRAG={on:false,timer:null,el:null,box:null,drop:null,trash:false,sx:0,sy:0,ox:0,oy:0,until:0,dirty:false};

function dragEnd(){
  dragCancelTimer(); if(!DRAG.on) return;

  DRAG.on=false; DRAG.until=Date.now()+400;

    const id=el.dataset.add, cats=JSON.parse(JSON.stringify(menuOf())), c=cats.find(c=>c.items.some(i=>i.id===id)), it=c&&c.items.find(i=>i.id===id);

  }

    const cats=JSON.parse(JSON.stringify(menuOf())), fc=cats.find(c=>c.cat===from), it=fc&&fc.items.find(i=>i.id===id);

      MENUS[BR]=cats; buildItems(); ME.draft=null;
      FB.fs.doc('misc/posmenu').set({[BR]:cats,updatedAt:new Date().toISOString(),by:W.name||''},{merge:true}).then(()=>toast(`「${it.name}」已移到${to}`)).catch(()=>toast('沒存成功，請再試一次',3500)); }
    render(); return;
  }

    const cat=box.dataset.catItems, subs=[...box.querySelectorAll('.item[data-pick]')].map(b=>b.dataset.pick.split('\u0001')[1]);

    FB.fs.doc('misc/posmenu').set({[BR]:cats,updatedAt:new Date().toISOString(),by:W.name||''},{merge:true}).then(()=>toast('順序已儲存')).catch(()=>toast('順序沒存成功，請再試一次',3500));
  }

}

function subOrders(){

  if(FB.unsub) FB.unsub(); FB.day=day; T.orders={};
  FB.unsub=FB.fs.collection('posorders').where('date','==',day).onSnapshot(snap=>{
    const o={}; snap.docs.forEach(d=>{o[d.id]=d.data();}); T.orders=o; T.loaded=true;
    if(T.tab==='today') render(); else if(T.tab==='reg'&&!cartLines().length) drawCart();
  },e=>{ toast(e&&e.code==='permission-denied'?'沒有讀取交易的權限：Firebase 規則需要開放 posorders':'讀取交易失敗',4000); });
}
setInterval(()=>{ if(W.name) subOrders(); },60000);  /* 過了午夜自動換到新的一天 */
function subMenu(){
  if(FB.menuUnsub) return;
  FB.menuUnsub=FB.fs.doc('misc/posmenu').onSnapshot(d=>{ const v=d.exists?d.data():{}; MENUS={...JSON.parse(JSON.stringify(MENU_DEF)),...Object.fromEntries(Object.keys(B).filter(k=>Array.isArray(v[k])).map(k=>[k,v[k]]))}; VORD=v.vendOrder||{}; VFLAT={'日日野餐':true,...(v.vendFlat||{})}; seedMenu(v); subVendors(vendTokens(v)); buildItems();
    if(T.tab==='reg'){ if(document.activeElement&&document.activeElement.matches('#cart input')) drawCart(); else render(); } else if(T.tab==='set'&&!ME.dirty){ ME.draft=null; render(); } },()=>{});
}
function applyAuth(){
  const u=FB.auth.currentUser;
  if(!u){ W.name=null; W.admin=false; if(FB.unsub){FB.unsub();FB.unsub=null;FB.day=null;} if(FB.menuUnsub){FB.menuUnsub();FB.menuUnsub=null;} render(); return; }
  if(!P.loaded||!P.staff||A.busy) return;
  const n=nameOfEmail(u.email);
  if(!n){ FB.auth.signOut(); A.err='這個帳號已被移除或重設密碼，請重新選擇名字登入'; return; }
  const was=W.name; W.name=n; W.uid=u.uid; W.admin=!!(P.staff&&P.staff.bossEmail===u.email); subOrders(); subMenu(); if(!was) render(); else renderWho();
}
setNet();
(function(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey){ render(); return; }
  firebase.initializeApp(cfg); FB.auth=firebase.auth(); FB.fs=firebase.firestore();
  try{ FB.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  render();
  FB.fs.doc('public/staff').onSnapshot(d=>{ P.staff=d.exists?d.data():null; P.loaded=true; if(FB.auth.currentUser) applyAuth(); else render(); },e=>{ P.loaded=true; A.err='讀不到人員名單：'+(e&&e.code||''); render(); });
  FB.auth.onAuthStateChanged(()=>applyAuth());
})();
</script>
